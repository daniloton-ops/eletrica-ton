<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Elétrica Ton • Gestão</title>
<style>
:root{--ink:#202020;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--white:#fff;--red:#c62828;--green:#16834a;--amber:#b77908;--danger:#d93636}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1000px;margin:auto;min-height:100dvh;padding-bottom:84px}.top{background:#202020;color:white;padding:20px 18px 18px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:1px solid #555;border-radius:10px;display:grid;place-items:center;font-size:24px}.top h1{font-size:18px;margin:0;letter-spacing:.5px}.top p{margin:4px 0 0;color:#c8c8c8;font-size:12px}.content{padding:18px}.eyebrow{font-size:11px;letter-spacing:1.2px;color:var(--muted);font-weight:700;margin:2px 0 10px}.page-title{font-size:25px;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 18px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;min-width:0}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:22px;font-weight:750;margin:8px 0 3px;overflow-wrap:anywhere}.hint{font-size:11px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;gap:8px}.section-head h2{font-size:16px;margin:0}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:650}.primary{background:var(--red);color:white}.secondary{background:#f0f1f3;color:#222;border:1px solid #e0e2e5}.small{padding:7px 10px;font-size:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#555;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dce1;border-radius:9px;background:white;color:#222;min-width:0}.field textarea{min-height:75px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.wide{grid-column:1/-1}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:5}.tab{border:0;background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:0;flex:1;padding:5px 0}.tab span:first-child{font-size:19px}.tab.active{color:var(--red);font-weight:750}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.item-title{font-weight:700}.muted{color:var(--muted);font-size:12px}.status{font-size:11px;font-weight:700;border-radius:99px;padding:5px 8px;white-space:nowrap}.s-green{background:#e7f5ec;color:var(--green)}.s-yellow{background:#fff4d6;color:var(--amber)}.s-red{background:#fde8e8;color:var(--danger)}.s-gray{background:#eef0f3;color:#555}.list-item{padding:12px 0;border-bottom:1px solid #eceef1}.list-item:last-child{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.line-items{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}.total{background:#202020;color:white;border-radius:12px;padding:15px;display:flex;justify-content:space-between;align-items:center;margin:12px 0}.total strong{font-size:20px}.search{margin-bottom:12px}.footnote{font-size:11px;color:var(--muted);line-height:1.5}.danger-text{color:var(--danger)}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.content{padding:26px}.mobile-only{display:none}}@media(max-width:390px){.content{padding:13px}.metric{font-size:19px}.page-title{font-size:23px}.btn{padding:10px 11px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
@media print{body{background:white}.top,.tabs,.no-print,.actions{display:none!important}.app{max-width:none;padding:0}.content{padding:0}.card{break-inside:avoid;border:0}.print-only{display:block!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">ϟ</div><div><h1>ELÉTRICA TON</h1><p>Gestão de serviços elétricos</p></div></header>
<main class="content" id="content"></main>
<nav class="tabs no-print" id="tabs">
<button type="button" class="tab active" data-page="inicio" onclick="setPage('inicio')"><span>⌂</span><span>Início</span></button>
<button type="button" class="tab" data-page="clientes" onclick="setPage('clientes')"><span>♙</span><span>Clientes</span></button>
<button type="button" class="tab" data-page="orcamentos" onclick="setPage('orcamentos')"><span>▤</span><span>Orçamentos</span></button>
<button type="button" class="tab" data-page="servicos" onclick="setPage('servicos')"><span>✓</span><span>Serviços</span></button>
<button type="button" class="tab" data-page="financeiro" onclick="setPage('financeiro')"><span>R$</span><span>Financeiro</span></button>
</nav>
</div>
<script>
const KEY='eletricaTonApp_v1';
let db=load(), page='inicio', editing=null, quoteItems=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{clients:[],quotes:[],services:[],payments:[],expenses:[]}}catch(e){return {clients:[],quotes:[],services:[],payments:[],expenses:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function clientName(cid){return db.clients.find(c=>c.id===cid)?.name||'Cliente não cadastrado'}
function paidFor(sid){return db.payments.filter(p=>p.serviceId===sid).reduce((a,p)=>a+Number(p.amount||0),0)}
function totalReceived(){return db.payments.reduce((a,p)=>a+Number(p.amount||0),0)}
function serviceTotal(s){return Number(s.total||0)}
function pendingTotal(){return db.services.reduce((a,s)=>a+Math.max(0,serviceTotal(s)-paidFor(s.id)),0)}
function badge(text,kind='gray'){return `<span class="status s-${kind}">${esc(text)}</span>`}
function setPage(p){page=p;editing=null;render()}
document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const root=document.getElementById('content');const pages={inicio:home,clientes:clients,orcamentos:quotes,servicos:services,financeiro:finance};root.innerHTML=pages[page]();bindPage()}
function home(){let late=db.services.filter(s=>s.due&&s.due<today()&&serviceTotal(s)>paidFor(s.id));return `<div class="eyebrow">VISÃO GERAL</div><h2 class="page-title">Painel de controle</h2><p class="sub">Resumo da sua operação</p><div class="grid">
<div class="card"><div class="metric-label">A receber</div><div class="metric">${money(pendingTotal())}</div><div class="hint">Saldo de serviços</div></div>
<div class="card"><div class="metric-label">Recebido</div><div class="metric" style="color:var(--green)">${money(totalReceived())}</div><div class="hint">Pagamentos registrados</div></div>
<div class="card"><div class="metric-label">Serviços ativos</div><div class="metric">${db.services.filter(s=>s.status!=='Concluído').length}</div><div class="hint">Em andamento</div></div>
<div class="card"><div class="metric-label">Orçamentos abertos</div><div class="metric">${db.quotes.filter(q=>q.status==='Aguardando').length}</div><div class="hint">Aguardando resposta</div></div></div>
<div class="section-head"><h2>Acesso rápido</h2></div><div class="grid">
<button type="button" class="card" data-go="orcamentos" style="text-align:left"><b>＋ Novo orçamento</b><p class="muted">Montar proposta e salvar PDF</p></button>
<button type="button" class="card" data-go="clientes" style="text-align:left"><b>＋ Novo cliente</b><p class="muted">Cadastrar contato e endereço</p></button>
<button type="button" class="card" data-go="servicos" style="text-align:left"><b>✓ Serviços</b><p class="muted">Etapas, prazos e andamento</p></button>
<button type="button" class="card" data-go="financeiro" style="text-align:left"><b>R$ Financeiro</b><p class="muted">Recebimentos e despesas</p></button></div>
${late.length?`<div class="section-head"><h2>Precisam de atenção</h2>${badge(late.length+' atrasado(s)','red')}</div><div class="card">${late.map(s=>`<div class="list-item row"><div><b>${esc(s.title)}</b><div class="muted">${esc(clientName(s.clientId))} · venc. ${esc(s.due)}</div></div>${badge('Atrasado','red')}</div>`).join('')}</div>`:''}
<p class="footnote">Os dados ficam salvos neste navegador e neste aparelho. Faça cópias de segurança regularmente; não há sincronização automática nesta versão.</p>`}
function clients(){if(editing?.type==='client')return clientForm(editing.id);return `<div class="eyebrow">CADASTRO</div><div class="section-head"><div><h2 class="page-title">Clientes</h2><p class="sub">Cadastro e histórico</p></div><button type="button" class="btn primary" data-action="new-client">＋ Novo</button></div><input class="field search" id="clientSearch" placeholder="Buscar por nome, telefone ou documento"><div class="card" id="clientList">${clientList()}</div>`}
function clientList(filter=''){let arr=db.clients.filter(c=>(c.name+' '+(c.phone||'')+' '+(c.doc||'')).toLowerCase().includes(filter.toLowerCase()));if(!arr.length)return '<div class="empty">Nenhum cliente cadastrado.</div>';return arr.map(c=>`<div class="list-item"><div class="row"><div><div class="item-title">${esc(c.name)}</div><div class="muted">${esc(c.phone||'Sem telefone')} · ${esc(c.address||'Sem endereço')}</div></div><button class="btn secondary small" data-action="edit-client" data-id="${c.id}">Editar</button></div><div class="actions"><button class="btn secondary small" data-action="client-quote" data-id="${c.id}">Novo orçamento</button><button class="btn secondary small" data-action="client-service" data-id="${c.id}">Novo serviço</button><button class="btn secondary small" data-action="delete-client" data-id="${c.id}">Excluir</button></div></div>`).join('')}
function clientForm(cid){let c=db.clients.find(x=>x.id===cid)||{};return `<div class="section-head"><h2>${cid?'Editar cliente':'Novo cliente'}</h2><button type="button" class="btn secondary" data-action="cancel">Voltar</button></div><form id="clientForm"><input type="hidden" name="id" value="${esc(c.id||'')}"><div class="field"><label>Nome / Razão social *</label><input name="name" required value="${esc(c.name||'')}"></div><div class="form-grid"><div class="field"><label>Telefone / WhatsApp</label><input name="phone" inputmode="tel" value="${esc(c.phone||'')}"></div><div class="field"><label>CPF / CNPJ</label><input name="doc" value="${esc(c.doc||'')}"></div><div class="field wide"><label>Endereço</label><input name="address" value="${esc(c.address||'')}"></div><div class="field wide"><label>Observações</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div><button class="btn primary" type="submit">Salvar cliente</button></form>`}
function quotes(){if(editing?.type==='quote')return quoteForm(editing.id);return `<div class="eyebrow">PROPOSTAS COMERCIAIS</div><div class="section-head"><div><h2 class="page-title">Orçamentos</h2><p class="sub">Monte, calcule e imprima em PDF</p></div><button type="button" class="btn primary" data-action="new-quote">＋ Novo</button></div><div class="card">${db.quotes.length?db.quotes.slice().reverse().map(q=>`<div class="list-item"><div class="row"><div><div class="item-title">${esc(q.title||'Orçamento')} · ${money(q.total)}</div><div class="muted">${esc(clientName(q.clientId))} · ${esc(q.date||'')}</div></div>${badge(q.status,q.status==='Aprovado'?'green':q.status==='Recusado'?'red':'yellow')}</div><div class="actions"><button class="btn secondary small" data-action="edit-quote" data-id="${q.id}">Abrir/editar</button><button class="btn secondary small" data-action="print-quote" data-id="${q.id}">Salvar PDF</button><button class="btn secondary small" data-action="approve-quote" data-id="${q.id}">Aprovado</button><button class="btn secondary small" data-action="delete-quote" data-id="${q.id}">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum orçamento criado.</div>'}</div>`}
function quoteForm(qid){let q=db.quotes.find(x=>x.id===qid)||{items:[{description:'',qty:1,price:0}],status:'Aguardando',date:today()};quoteItems=JSON.parse(JSON.stringify(q.items||[]));if(!quoteItems.length)quoteItems=[{description:'',qty:1,price:0}];return `<div class="section-head"><h2>${qid?'Editar orçamento':'Novo orçamento'}</h2><button type="button" class="btn secondary" data-action="cancel">Voltar</button></div><form id="quoteForm"><input type="hidden" name="id" value="${esc(q.id||'')}"><div class="field"><label>Título / serviço</label><input name="title" required value="${esc(q.title||'Instalação elétrica')}"></div><div class="field"><label>Cliente *</label><select name="clientId" required><option value="">Selecione</option>${db.clients.map(c=>`<option value="${c.id}" ${q.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${!db.clients.length?'<span class="muted">Cadastre um cliente antes de criar o orçamento.</span>':''}</div><div class="form-grid"><div class="field"><label>Data</label><input type="date" name="date" value="${esc(q.date||today())}"></div><div class="field"><label>Validade (dias)</label><input type="number" name="validity" min="1" value="${esc(q.validity||15)}"></div></div><div class="section-head"><h2>Itens / mão de obra</h2><button type="button" class="btn secondary small" data-action="add-quote-item">＋ Item</button></div><div id="quoteItems">${quoteItemHTML()}</div><div class="total"><span>Total do orçamento</span><strong id="quoteTotal">${money(quoteSum())}</strong></div><div class="field"><label>Observações e condições</label><textarea name="notes">${esc(q.notes||'')}</textarea></div><button class="btn primary" type="submit">Salvar orçamento</button></form>`}
function quoteItemHTML(){return quoteItems.map((it,i)=>`<div class="line-items" data-item="${i}"><div class="field"><label>Descrição</label><input data-item-field="description" value="${esc(it.description)}" placeholder="Ex.: Instalação de luminária"></div><div class="form-grid"><div class="field"><label>Quantidade</label><input data-item-field="qty" type="number" min="0" step="0.01" value="${Number(it.qty||1)}"></div><div class="field"><label>Valor unitário (R$)</label><input data-item-field="price" type="number" min="0" step="0.01" value="${Number(it.price||0)}"></div></div><div class="row"><span class="muted">Subtotal: <b>${money(Number(it.qty||0)*Number(it.price||0))}</b></span><button type="button" class="btn secondary small" data-action="remove-quote-item" data-index="${i}">Remover</button></div></div>`).join('')}
function quoteSum(){return quoteItems.reduce((a,x)=>a+Number(x.qty||0)*Number(x.price||0),0)}
function services(){if(editing?.type==='service')return serviceForm(editing.id);return `<div class="eyebrow">EXECUÇÃO</div><div class="section-head"><div><h2 class="page-title">Serviços</h2><p class="sub">Etapas, prazos e recebimentos</p></div><button type="button" class="btn primary" data-action="new-service">＋ Novo</button></div><div class="card">${db.services.length?db.services.slice().reverse().map(s=>{let bal=serviceTotal(s)-paidFor(s.id);let kind=s.status==='Concluído'?'green':s.due&&s.due<today()&&bal>0?'red':'yellow';return `<div class="list-item"><div class="row"><div><div class="item-title">${esc(s.title)}</div><div class="muted">${esc(clientName(s.clientId))} · ${money(serviceTotal(s))}</div></div>${badge(s.status==='Concluído'?'Concluído':kind==='red'?'Atrasado':s.status,kind)}</div><div class="muted">Etapa: ${esc(s.stage||'A definir')} · Saldo: <b>${money(Math.max(0,bal))}</b>${s.due?' · Prazo: '+esc(s.due):''}</div><div class="actions"><button class="btn secondary small" data-action="edit-service" data-id="${s.id}">Editar</button><button class="btn secondary small" data-action="receive" data-id="${s.id}">Registrar pagamento</button><button class="btn secondary small" data-action="delete-service" data-id="${s.id}">Excluir</button></div></div>`}).join(''):'<div class="empty">Nenhum serviço cadastrado.</div>'}</div>`}
function serviceForm(sid){let s=db.services.find(x=>x.id===sid)||{};return `<div class="section-head"><h2>${sid?'Editar serviço':'Novo serviço'}</h2><button type="button" class="btn secondary" data-action="cancel">Voltar</button></div><form id="serviceForm"><input type="hidden" name="id" value="${esc(s.id||'')}"><div class="field"><label>Descrição do serviço *</label><input name="title" required value="${esc(s.title||'')}"></div><div class="field"><label>Cliente *</label><select name="clientId" required><option value="">Selecione</option>${db.clients.map(c=>`<option value="${c.id}" ${s.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Valor total (R$)</label><input name="total" type="number" min="0" step="0.01" value="${Number(s.total||0)}"></div><div class="field"><label>Prazo / vencimento</label><input name="due" type="date" value="${esc(s.due||'')}"></div><div class="field"><label>Etapa atual</label><select name="stage">${['A definir','Agendado','Materiais','Em execução','Finalização','Entrega'].map(x=>`<option ${s.stage===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Planejado','Em andamento','Aguardando material','Concluído'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Observações</label><textarea name="notes">${esc(s.notes||'')}</textarea></div><button class="btn primary" type="submit">Salvar serviço</button></form>`}
function finance(){return `<div class="eyebrow">CONTROLE FINANCEIRO</div><h2 class="page-title">Financeiro</h2><p class="sub">Recebimentos, saldos e despesas</p><div class="grid"><div class="card"><div class="metric-label">A receber</div><div class="metric">${money(pendingTotal())}</div></div><div class="card"><div class="metric-label">Recebido</div><div class="metric" style="color:var(--green)">${money(totalReceived())}</div></div><div class="card"><div class="metric-label">Despesas registradas</div><div class="metric danger-text">${money(db.expenses.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card"><div class="metric-label">Saldo registrado</div><div class="metric">${money(totalReceived()-db.expenses.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div></div><div class="section-head"><h2>Registrar despesa</h2></div><form id="expenseForm" class="card"><div class="field"><label>Descrição *</label><input name="description" required placeholder="Ex.: Compra de materiais"></div><div class="form-grid"><div class="field"><label>Valor (R$) *</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Data</label><input name="date" type="date" value="${today()}"></div></div><button class="btn primary" type="submit">Salvar despesa</button></form><div class="section-head"><h2>Últimos recebimentos</h2></div><div class="card">${db.payments.length?db.payments.slice().reverse().map(p=>`<div class="list-item row"><div><b>${esc(p.description||clientName(db.services.find(s=>s.id===p.serviceId)?.clientId))}</b><div class="muted">${esc(p.date||'')} · ${esc(p.method||'Não informado')}</div></div><b style="color:var(--green)">${money(p.amount)}</b></div>`).join(''):'<div class="empty">Nenhum recebimento registrado.</div>'}</div><div class="section-head"><h2>Despesas</h2></div><div class="card">${db.expenses.length?db.expenses.slice().reverse().map(x=>`<div class="list-item row"><div><b>${esc(x.description)}</b><div class="muted">${esc(x.date||'')}</div></div><b class="danger-text">${money(x.amount)}</b></div>`).join(''):'<div class="empty">Nenhuma despesa registrada.</div>'}</div><div class="actions no-print"><button type="button" class="btn secondary" data-action="export">Exportar backup JSON</button><button type="button" class="btn secondary" data-action="import">Importar backup</button><button type="button" class="btn secondary" data-action="print-summary">Imprimir resumo</button></div><p class="footnote">Financeiro simplificado: saldo calculado a partir dos serviços, recebimentos e despesas cadastrados. Confirme os registros antes de usar como controle contábil.</p>`}
function bindPage(){
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id,b.dataset.index));
const cs=document.getElementById('clientSearch');if(cs)cs.oninput=()=>document.getElementById('clientList').innerHTML=clientList(cs.value);
const cf=document.getElementById('clientForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(cf));if(d.id){db.clients=db.clients.map(c=>c.id===d.id?{...c,...d}:c)}else db.clients.push({...d,id:id()});save();editing=null;render()};
const qf=document.getElementById('quoteForm');if(qf){qf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(qf));let q={...d,id:d.id||id(),items:quoteItems.map(x=>({...x,qty:Number(x.qty),price:Number(x.price)})),total:quoteSum(),status:(db.quotes.find(x=>x.id===d.id)||{}).status||'Aguardando'};if(d.id)db.quotes=db.quotes.map(x=>x.id===d.id?q:x);else db.quotes.push(q);save();editing=null;render()};document.getElementById('quoteItems').oninput=e=>{let el=e.target.closest('[data-item]');if(!el)return;let i=+el.dataset.item;let f=e.target.dataset.itemField;if(f){quoteItems[i][f]=f==='description'?e.target.value:Number(e.target.value);document.getElementById('quoteTotal').textContent=money(quoteSum());let old=el.querySelector('.muted b');if(old)old.textContent=money(Number(quoteItems[i].qty||0)*Number(quoteItems[i].price||0))}}}
const sf=document.getElementById('serviceForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(sf));let s={...d,id:d.id||id(),total:Number(d.total||0)};if(d.id)db.services=db.services.map(x=>x.id===d.id?s:x);else db.services.push(s);save();editing=null;render()};
const ef=document.getElementById('expenseForm');if(ef)ef.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(ef));db.expenses.push({...d,id:id(),amount:Number(d.amount)});save();render()};
}
function action(a,cid,idx){switch(a){
case'new-client':editing={type:'client'};render();break;case'edit-client':editing={type:'client',id:cid};render();break;case'cancel':editing=null;render();break;
case'delete-client':if(confirm('Excluir este cliente?')){db.clients=db.clients.filter(c=>c.id!==cid);save();render()}break;
case'client-quote':editing={type:'quote',clientId:cid};render();{let s=document.querySelector('#quoteForm select[name=clientId]');if(s)s.value=cid}break;
case'client-service':editing={type:'service',clientId:cid};render();{let s=document.querySelector('#serviceForm select[name=clientId]');if(s)s.value=cid}break;
case'new-quote':quoteItems=[{description:'',qty:1,price:0}];editing={type:'quote'};render();break;case'edit-quote':editing={type:'quote',id:cid};render();break;
case'add-quote-item':quoteItems.push({description:'',qty:1,price:0});document.getElementById('quoteItems').innerHTML=quoteItemHTML();bindPage();break;
case'remove-quote-item':quoteItems.splice(Number(idx),1);if(!quoteItems.length)quoteItems.push({description:'',qty:1,price:0});document.getElementById('quoteItems').innerHTML=quoteItemHTML();document.getElementById('quoteTotal').textContent=money(quoteSum());bindPage();break;
case'approve-quote':{let q=db.quotes.find(x=>x.id===cid);if(q){q.status='Aprovado';if(!db.services.some(s=>s.quoteId===q.id))db.services.push({id:id(),quoteId:q.id,clientId:q.clientId,title:q.title,total:q.total,status:'Planejado',stage:'A definir',due:''});save();render()}}break;
case'delete-quote':if(confirm('Excluir orçamento?')){db.quotes=db.quotes.filter(q=>q.id!==cid);save();render()}break;
case'print-quote':printQuote(cid);break;
case'new-service':editing={type:'service'};render();break;case'edit-service':editing={type:'service',id:cid};render();break;
case'delete-service':if(confirm('Excluir serviço? Os recebimentos vinculados também serão removidos.')){db.services=db.services.filter(s=>s.id!==cid);db.payments=db.payments.filter(p=>p.serviceId!==cid);save();render()}break;
case'receive':receive(cid);break;case'export':exportBackup();break;case'import':importBackup();break;case'print-summary':window.print();break;
}}
function receive(sid){let s=db.services.find(x=>x.id===sid);if(!s)return;let remain=Math.max(0,serviceTotal(s)-paidFor(sid));let amount=prompt('Saldo atual: '+money(remain)+'\\nValor recebido (R$):',remain.toFixed(2).replace('.',','));if(amount===null)return;let n=Number(amount.replace(',','.'));if(!Number.isFinite(n)||n<=0){alert('Informe um valor válido.');return}let method=prompt('Forma de pagamento (Pix, dinheiro, cartão etc.):','Pix')||'Não informado';db.payments.push({id:id(),serviceId:sid,description:s.title,amount:n,date:today(),method});save();render()}
function printQuote(qid){let q=db.quotes.find(x=>x.id===qid);if(!q)return;let c=db.clients.find(x=>x.id===q.clientId)||{};let w=window.open('','_blank');if(!w){alert('Permita pop-ups para gerar o PDF.');return}w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Orçamento - Elétrica Ton</title><style>body{font:13px Arial;color:#222;margin:35px}header{border-bottom:4px solid #c62828;padding-bottom:15px;display:flex;justify-content:space-between}h1{margin:0;font-size:22px}small{color:#666}h2{font-size:17px;margin:28px 0 8px}table{width:100%;border-collapse:collapse;margin-top:15px}th{background:#202020;color:#fff;text-align:left}td,th{padding:10px;border-bottom:1px solid #ddd}td:last-child,th:last-child{text-align:right}.total{margin-top:20px;background:#c62828;color:#fff;padding:15px;text-align:right;font-size:20px;font-weight:bold}.foot{margin-top:35px;border-top:1px solid #ddd;padding-top:12px;color:#555;font-size:11px}@media print{body{margin:15mm}}</style></head><body><header><div><h1>ELÉTRICA TON</h1><small>Serviços e instalações elétricas · Residencial, comercial e automação</small></div><div style="text-align:right"><b>ORÇAMENTO DE SERVIÇOS</b><br><small>Data: ${esc(q.date||today())}</small></div></header><p><b>CLIENTE:</b> ${esc(c.name||'')}<br><b>Telefone:</b> ${esc(c.phone||'')}<br><b>Endereço:</b> ${esc(c.address||'')}</p><h2>${esc(q.title||'Orçamento')}</h2><table><thead><tr><th>Descrição</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${Number(i.qty)}</td><td>${money(i.price)}</td><td>${money(Number(i.qty)*Number(i.price))}</td></tr>`).join('')}</tbody></table><div class="total">TOTAL: ${money(q.total)}</div><p><b>Condições / observações:</b><br>${esc(q.notes||'Valores sujeitos à confirmação. Serviços e materiais conforme descritos neste orçamento.').replace(/\n/g,'<br>')}</p><div class="foot">ELÉTRICA TON · CNPJ 22.429.593/0001-49<br>Pagamento via Pix ou conforme combinado.<br><br>Agradecemos a confiança em nosso trabalho!</div><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-eletrica-ton-'+today()+'.json';a.click();URL.revokeObjectURL(url)}
function importBackup(){let input=document.createElement('input');input.type='file';input.accept='application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.clients||!x.quotes||!x.services||!x.payments)throw Error();if(confirm('Substituir os dados atuais pelo backup selecionado?')){db={clients:x.clients,quotes:x.quotes,services:x.services,payments:x.payments,expenses:x.expenses||[]};save();render()}}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)};input.click()}
render();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
</script>
